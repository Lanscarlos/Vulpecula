

# bacikal 配置
bacikal:
  # 是否启用符号闭合检测
  analysis-symbol-closure: true

  # 编译器
  compiler: 'bacikal'
  # 执行器
  executor: 'kether'
  # 默认编译命名空间
  default-compile-namespace:
    - 'vulpecula'
    - 'kether'

  # 注释匹配规则
  comment-pattern:
    # 单行注释
    # 匹配 // 及其后所有字符直至换行
    single-line: '(?<!\\)//[^\n]*(?=\n|\r)'
    # 多行注释
    # 匹配 /* 直到 */
    multi-line: '(?<!\\)/\*[^(\*/)]*\*/'