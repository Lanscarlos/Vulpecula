# 监听事件
listen-event: 'org.bukkit.event.player.PlayerMoveEvent'
# 监听优先级
listen-priority: 'normal'
# 是否监听已取消的事件
listen-cancelled: false

# 规则
rule:
  # 触发优先级
  trigger-priority: 1
  # 是否需要玩家
  require-player: true
  # 是否监听视角的变化
  listen-view-change: true
  # 最小监听距离
  min-distance: 0.01

# 过滤器
filter:
  # 条件检查
    condition-check:
        # 条件
        condition:
        - '...'
        # 条件类型
        condition-type: '...'
        # 条件检查类型
        check-type: '...'

# 脚本
script:
  # 脚本超时
  timeout: 5s
  on-error: ...
  # 是否异步执行脚本
  async: false
  # 是否阻塞并等待脚本运行完毕 (谨慎操作)
  blocking: true
  # 预设变量
  variables:
    display: 'wcnm'
  # 编译命名空间
  namespace: [...]
  # 前置处理, 会在外部脚本执行前执行
  preprocess: ...
  # 后置处理, 会在外部脚本执行后执行
  postprocess: ...
  # 链接的外部脚本
  link: [...]