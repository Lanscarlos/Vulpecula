name: Release

# 发布正式版。版本号只有一个出处：gradle.properties 里的 version。
# 改动它并合进 v2，这里就会把 tag 打在那个提交上并发布；没改版本号的合并
# 会在几秒内跳过，不会进构建。
#
# 另外两种触发走的是同一条路：
#   1. 手动推一个 2.3.16 这样的 tag；
#   2. 手动运行本工作流，tag 留空就取 gradle.properties，填了就用填的。
# 手动运行同时也是重试手段：对已经存在的 tag 再跑一次，会覆盖掉上一次的
# 附件和发布说明，而不是报错。
#
# 发布说明的正文取自 CHANGELOG.md 里同版本号的小节，没有对应小节就退回
# GitHub 按提交自动生成的那份。
on:
  push:
    branches: [v2]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      # 快照的 tag 由 Snapshot 工作流自己发布，不走这里。
      - '!*-SNAPSHOT.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号，例如 2.3.16；留空则读取 gradle.properties'
        required: false

# 建 tag、发 release 都需要写权限。
permissions:
  contents: write

# 发布不能被后一次运行掐断，否则会留下一个附件传了一半的 release。
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # 先用一个轻量的 job 把版本号定下来，顺便判断这次到底要不要发。普通的
  # 合并到这里就停了，不用白跑一次构建。
  resolve:
    name: 确定版本
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      # tag 一律通过环境变量进入脚本，不做字符串拼接。
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          declared="$(sed -n 's/^version=//p' gradle.properties | head -1 | tr -d '[:space:]')"

          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            # 合并进 v2：这条分支此刻自称的版本号就是要发的版本号。
            tag="$declared"
            if [ -z "$tag" ]; then
              echo "::warning::gradle.properties 里没读到 version，跳过发布"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号「$tag」不符合 x.y.z 或 x.y.z-rc.1 的格式"
            exit 1
          fi

          # tag 是否已经存在，决定了两件事：这次还要不要发，以及该检出哪个 ref。
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
             || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi

          # 没动版本号的合并落在一个已经存在的 tag 上，这是常态，不是错误。
          # 手动推 tag 或手动运行则一律照办，好让传挂了的发布能重来一次。
          if [ "$EVENT" = push ] && [ "$REF_TYPE" != tag ] && [ "$exists" = true ]; then
            echo "$tag 已经发布过了，跳过"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # jar 的文件名直接取自版本号，构建时会用 -Pversion 覆盖成 tag，
          # 保证 release 里的文件名和 tag 永远一致；两边对不上多半是漏改了
          # gradle.properties，值得提醒一句，但不必拦住发布。
          if [ "$declared" != "$tag" ]; then
            echo "::warning::gradle.properties 里的版本号是 $declared，与本次发布的 $tag 不一致"
          fi

          # tag 已经存在就检出它，让发布的内容严格等于那个 tag 指向的提交；
          # 还不存在则用当前提交，稍后由 GitHub 建 tag。
          if [ "$exists" = true ]; then
            ref="$tag"
          else
            ref="$GITHUB_SHA"
          fi

          # 带后缀的版本号（2.4.0-rc.1）按预发布处理。
          if printf '%s' "$tag" | grep -q -- '-'; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "准备发布 $tag (prerelease=$prerelease)"
          {
            echo "release=true"
            echo "tag=$tag"
            echo "ref=$ref"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  release:
    name: 构建并发布
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # -Pversion 覆盖 gradle.properties，jar 名和 plugin.yml 里的 version
      # 都会跟着变成本次发布的版本号。
      - name: 构建
        run: ./gradlew build -Pversion=${{ needs.resolve.outputs.tag }}

      - name: 记录提交
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 正文取自 CHANGELOG.md 里同版本号的小节。没有对应小节不算失败，退回
      # GitHub 按提交自动生成的那份，发布照常进行。
      - name: 生成发布说明
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ steps.sha.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # 版本号里的点在正则里是通配符，先转义再交给 awk。
          pattern="^## \\[$(printf '%s' "$TAG" | sed 's/\./\\./g')\\]"
          extract() {
            [ -f "$1" ] || return 0
            awk -v pat="$pattern" '
              $0 ~ pat        { found = 1; next }
              found && /^## / { exit }
              found           { print }
            ' "$1"
          }

          extract CHANGELOG.md > notes.md

          # tag 打完才补写更新日志的情况：tag 上那份没有这一节，去默认分支上
          # 的最新版本里再找一次，这样重跑一次就能把说明补齐，不必动 tag。
          if [ ! -s notes.md ] && [ -n "$DEFAULT_BRANCH" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$DEFAULT_BRANCH" \
                 --jq .content 2>/dev/null | base64 -d > head-changelog.md 2>/dev/null; then
              extract head-changelog.md > notes.md
            fi
          fi

          if [ -s notes.md ]; then
            echo "发布说明取自 CHANGELOG.md 的 [$TAG] 小节"
          else
            echo "::warning::CHANGELOG.md 里没有 [$TAG] 这一节，改用自动生成的发布说明"
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                   -f tag_name="$TAG" -f target_commitish="$SHA" \
                   --jq .body > notes.md; then
              echo "::warning::自动生成发布说明也失败了，本次只附安装说明"
              : > notes.md
            fi
          fi

          cat >> notes.md <<EOF

          ## 安装

          下载 \`Vulpecula-${TAG}.jar\`，放进服务端的 \`plugins\` 目录后重启即可。
          依赖由 TabooLib 在首次启动时自动下载，需要能联网。
          EOF

      # tag 还不存在时，--target 会让 GitHub 顺手把 tag 建在这个提交上；
      # tag 推送的场景里 tag 已经在了，--target 会被忽略。
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ steps.sha.outputs.sha }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          # 每次都显式声明，这样重跑可以纠正上一次标错的预发布状态。
          if [ "$PRERELEASE" = true ]; then
            flag=--prerelease
          else
            flag=--prerelease=false
          fi

          asset="build/libs/Vulpecula-${TAG}.jar"
          if [ ! -f "$asset" ]; then
            echo "::error::没找到 $asset"
            ls -l build/libs || true
            exit 1
          fi

          # 对已存在的 release 重跑时替换附件和说明，而不是失败。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Release $TAG" --notes-file notes.md "$flag"
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" \
              --title "Release $TAG" --notes-file notes.md "$flag" \
              --target "$SHA"
          fi

      # 通向这个版本的快照，等的就是它。正常情况下发版那次推送本就不该出快照
      # （Snapshot 工作流会让路），这里是兜底：真出了的话补掉，免得正式版和
      # 快照并排挂在发布页上。只删版本号严格以 "<本次版本>-SNAPSHOT." 开头的。
      - name: 清理该版本的快照
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName \
            --jq '.[] | select(.tagName | startswith("'"$TAG"'-SNAPSHOT.")) | .tagName' \
            > stale.txt
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "删除已被 $TAG 取代的快照 $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done < stale.txt
