name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read project version
        id: version
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ -z "$version" ]; then
            echo "::error::未能从 gradle.properties 读取 version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "读取到版本号：$version"

      # jar 名为 Vulpecula-<version>.jar，tag 与版本号不一致会导致发布的文件名对不上
      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version='${{ steps.version.outputs.version }}'
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag ($GITHUB_REF_NAME) 与 gradle.properties 中的版本号 ($version) 不一致"
            exit 1
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vulpecula-${{ steps.version.outputs.version }}
          path: build/libs/Vulpecula-*.jar
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes \
            "build/libs/Vulpecula-${{ steps.version.outputs.version }}.jar"
