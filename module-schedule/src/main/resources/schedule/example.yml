
# 循环间隔
# 支持的单位:
# 游戏刻 tick, t
# 秒 second, s
# 分 minute, min, m
# 时 hour, h
period: '45s'

# 限定时间范围
# 格式必须为 HH:mm:ss-HH:mm:ss
duration: '00:00:05-24:00:00'

# 脚本执行者
# null 无
# console 控制台
# players 每个在线玩家
# player-in-world@xxx 指定世界内的所有玩家
sender: 'players'

# 执行模块
# 支持调用脚本 script@<脚本ID>, 例如：script@example
# 支持激活日程 schedule@<日程ID>, 例如：schedule@example
execute: |-
    tell hi!
