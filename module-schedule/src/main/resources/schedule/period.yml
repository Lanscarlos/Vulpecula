
# 日程类型
type: 'period'

# 循环间隔
# 支持的单位:
# 游戏刻 tick, t
# 秒 second, s
# 分 minute, min, m
# 时 hour, h
period: '5s'

# [选填] 延迟激活
# 格式参考 period 字段
delay: '5s'

# [选填] 最大运转时间
# 格式参考 period 字段
duration: '5m'

# [选填] 最大循环次数, 默认为 -1
# 设置为 -1 则无视循环次数
max-runs: 10

# [选填] 自启动, 默认为 false
# 是否在服务器启动后自动激活日程
auto-start: true

# [选填] 原型模式
# 启用后允许该日程多次执行
prototype: false

# [选填] 脚本执行者, 默认为 console
# null 无
# console 控制台
# players 每个在线玩家
# player-in-world@xxx 指定世界内的所有玩家
sender: '@console'

# 执行模块
# 支持调用脚本 script@<脚本ID>, 例如：script@example
# 支持激活日程 schedule@<日程ID>, 例如：schedule@example
execute: |-
    tell join [ "Hello, counter >> " &count ]
